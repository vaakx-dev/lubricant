import wd40.lubricant.buildscript.AccessWidenerToTransformerConverter

plugins {
    id 'net.minecraftforge.gradle' version '6.0.27'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "${mod_id}-forge"
}

// Share common's source + resource dirs.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

// Convert the canonical Fabric .accesswidener -> Forge accesstransformer.cfg at config time.
// Forge needs the AT file to exist when the minecraft block evaluates.
def awFile = rootProject.file('common/src/main/resources/lubricant.accesswidener')
def generatedResources = file("${buildDir}/generated/resources")
def atFile = new File(generatedResources, 'META-INF/accesstransformer.cfg')
AccessWidenerToTransformerConverter.writeAt(awFile.toPath(), atFile.toPath())
sourceSets.main.resources.srcDir generatedResources

minecraft {
    mappings channel: 'parchment',
             version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    accessTransformer = atFile

    runs {
        client {
            workingDirectory project.file('runs/client')
            mods {
                lubricant { source sourceSets.main }
                cog { source project(':example:cog:forge').sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('runs/server')
            mods {
                lubricant { source sourceSets.main }
                cog { source project(':example:cog:forge').sourceSets.main }
            }
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn ':example:cog:forge:classes', ':example:cog:forge:processResources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'mc_version', project.minecraft_version
    inputs.property 'forge_version', project.forge_version

    filesMatching('META-INF/mods.toml') {
        expand([
                version      : project.mod_version,
                mc_version   : project.minecraft_version,
                forge_version: project.forge_version
        ])
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_id,
                'Specification-Vendor'  : project.mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.mod_id,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : project.mod_authors
        ])
    }
}
