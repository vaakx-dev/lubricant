// buildSrc is a Gradle convention: code here gets compiled and put on the classpath
// of every other build.gradle in this project. Lets us write Gradle tasks in plain Java.

plugins {
    id 'java-gradle-plugin'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.parchmentmc.org/" }
}

dependencies {
    // FabricMC's mapping reader. Handles ProGuard (Mojang) format, Tiny v2, and Parchment JSON.
    implementation 'net.fabricmc:mapping-io:0.6.1'

    // FabricMC's remapper. Rewrites class/field/method/parameter refs in a jar.
    implementation 'net.fabricmc:tiny-remapper:0.10.4'

    // FabricMC's access widener: parses .accesswidener files and applies them via ASM.
    implementation 'net.fabricmc:access-widener:2.1.0'

    // For parsing Mojang's launcher manifest JSON.
    implementation 'com.google.code.gson:gson:2.11.0'

    // ASM for the access widener visitor pipeline.
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
}
