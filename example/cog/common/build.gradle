import wd40.lubricant.buildscript.SetupVanillaMinecraftTask

// Cog's common module. Same vanilla setup as lubricant/common, plus depends on
// lubricant's common so we can see ItemRegistry / Init.

def vanillaMcJar = layout.buildDirectory.file("minecraft/minecraft-${minecraft_version}-mojmap.jar")

tasks.register('setupVanillaMinecraft', SetupVanillaMinecraftTask) {
    mcVersion = project.minecraft_version
    parchmentVersion = project.parchment_mappings_version
    parchmentMcVersion = project.parchment_minecraft_version
    outputJar = vanillaMcJar
}

tasks.named('compileJava').configure {
    dependsOn 'setupVanillaMinecraft'
}

repositories {
    // Mojang's library repo - hosts brigadier and DataFixerUpper, both needed at
    // compile time when StreamCodec.composite overloads are referenced.
    maven { url = "https://libraries.minecraft.net" }
}

dependencies {
    compileOnly files(vanillaMcJar).builtBy('setupVanillaMinecraft')
    // Lubricant common's compiled classes (Init, ItemRegistry, etc.).
    compileOnly rootProject.project(':common').sourceSets.main.output
    // slf4j is provided at runtime by both Fabric and NeoForge - compile-only here.
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    // DFU for StreamCodec.composite (Function3..Function6 are referenced by the multi-arg overloads).
    compileOnly "com.mojang:datafixerupper:8.0.16"
    // Netty's ByteBuf - StreamCodec.composite touches it via ByteBufCodecs return types.
    compileOnly "io.netty:netty-buffer:4.1.97.Final"
}
