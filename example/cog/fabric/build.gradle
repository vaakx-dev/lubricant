plugins {
    id 'fabric-loom' version '1.7.4'
}

base {
    archivesName = "cog-fabric"
}

// Pull cog/common's sources + resources (incl. lubricant-generated assets) into this build.
sourceSets.main.java.srcDir rootProject.file('example/cog/common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('example/cog/common/src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('example/cog/common/src/main/generated/resources')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Lubricant common's compiled classes (Init, ItemRegistry, etc.) on compile classpath.
    // Not bundled into cog's jar - lubricant-fabric ships separately as its own mod.
    compileOnly rootProject.project(':common').sourceSets.main.output
}

processResources {
    inputs.property 'version', '1.0.0'
    inputs.property 'mc_version', project.minecraft_version
    inputs.property 'fabric_loader_version', project.fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand([
                version              : '1.0.0',
                mc_version           : project.minecraft_version,
                fabric_loader_version: project.fabric_loader_version
        ])
    }
}
