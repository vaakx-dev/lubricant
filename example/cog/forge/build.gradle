plugins {
    id 'net.minecraftforge.gradle' version '6.0.27'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "cog-forge"
}

sourceSets.main.java.srcDir rootProject.file('example/cog/common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('example/cog/common/src/main/resources')

minecraft {
    mappings channel: 'parchment',
             version: "${parchment_mappings_version}-${parchment_minecraft_version}"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly rootProject.project(':common').sourceSets.main.output
}

processResources {
    inputs.property 'version', '1.0.0'
    inputs.property 'mc_version', project.minecraft_version
    inputs.property 'forge_version', project.forge_version

    filesMatching('META-INF/mods.toml') {
        expand([
                version      : '1.0.0',
                mc_version   : project.minecraft_version,
                forge_version: project.forge_version
        ])
    }
}

jar {
    manifest {
        attributes([
                'Implementation-Title'  : 'cog',
                'Implementation-Version': '1.0.0'
        ])
    }
}
