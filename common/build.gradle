import wd40.vaakx.lubricant.buildscript.SetupVanillaMinecraftTask

// The 'common' module compiles against vanilla Minecraft only.
// Loader-specific code lives in :fabric, :forge, :neoforge.

def vanillaMcJar = layout.buildDirectory.file("minecraft/minecraft-${minecraft_version}-mojmap.jar")

tasks.register('setupVanillaMinecraft', SetupVanillaMinecraftTask) {
    mcVersion = project.minecraft_version
    parchmentVersion = project.parchment_mappings_version
    parchmentMcVersion = project.parchment_minecraft_version
    accessWideners.from(fileTree('src/main/resources') { include '*.accesswidener' })
    outputJar = vanillaMcJar
}

// All compile/test tasks need MC ready first.
tasks.named('compileJava').configure {
    dependsOn 'setupVanillaMinecraft'
}

dependencies {
    // Vanilla MC is a compile-only classpath entry. Loader modules add their own MC
    // (with mappings their loader expects) when they consume :common.
    compileOnly files(vanillaMcJar)
}

// Make the vanilla MC jar available to other subprojects that depend on :common.
configurations {
    vanillaMc {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    vanillaMc(vanillaMcJar) {
        builtBy tasks.named('setupVanillaMinecraft')
    }
}
