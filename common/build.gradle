import wd40.lubricant.buildscript.SetupVanillaMinecraftTask

apply plugin: 'maven-publish'

// The 'common' module compiles against vanilla Minecraft only.
// Loader-specific code lives in :fabric, :forge, :neoforge.

def vanillaMcJar = layout.buildDirectory.file("minecraft/minecraft-${minecraft_version}-mojmap.jar")

tasks.register('setupVanillaMinecraft', SetupVanillaMinecraftTask) {
    mcVersion = project.minecraft_version
    parchmentVersion = project.parchment_mappings_version
    parchmentMcVersion = project.parchment_minecraft_version
    accessWideners.from(fileTree('src/main/resources') { include '*.accesswidener' })
    outputJar = vanillaMcJar
}

// All compile/test tasks need MC ready first.
tasks.named('compileJava').configure {
    dependsOn 'setupVanillaMinecraft'
}

repositories {
    // Mojang's library repo - hosts brigadier and other MC-bundled libs not on Maven Central.
    maven { url = "https://libraries.minecraft.net" }
}

dependencies {
    // Vanilla MC is a compile-only classpath entry. Loader modules add their own MC
    // (with mappings their loader expects) when they consume :common.
    compileOnly files(vanillaMcJar)
    // Brigadier ships separately from the MC jar (see MinecraftJarFilter note). The public
    // Events API exposes CommandDispatcher in commands(), so common needs it on the
    // compile classpath. Loader modules already bring their own copy at runtime.
    compileOnly "com.mojang:brigadier:1.2.9"
    // Gson + Guava are bundled with MC at runtime - compile-only here for the
    // datagen JSON builder in datagen.Provider.
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "com.google.guava:guava:33.3.1-jre"
    // DFU brings com.mojang.serialization.Codec - DataProvider.saveStable signature
    // touches it (CompletableFuture<?> saveStable(CachedOutput, Codec<T>, T, Path)).
    compileOnly "com.mojang:datafixerupper:8.0.16"
    // joml is referenced indirectly via com.mojang.math.Axis (returns Quaternionf etc.)
    // in core/client/SpinningItemRenderer. Both loaders ship joml at runtime via MC.
    compileOnly "org.joml:joml:1.10.5"
    // Netty buffer - StreamCodec is parameterised on ByteBuf, AutoCodec needs to
    // reference it transitively via the ByteBufCodecs constants.
    compileOnly "io.netty:netty-buffer:4.1.97.Final"
}

// Make the vanilla MC jar available to other subprojects that depend on :common.
configurations {
    vanillaMc {
        canBeConsumed = true
        canBeResolved = false
    }
}
artifacts {
    vanillaMc(vanillaMcJar) {
        builtBy tasks.named('setupVanillaMinecraft')
    }
}

// Bundle: single jar that loads on both Fabric and NeoForge.
// Wraps :fabric:remapJar and :neoforge:jar as nested jars (JIJ).
// Metadata templates live in common/bundle/ - kept outside src/main/resources
// so they don't leak into the per-loader jars.
tasks.register('bundle', Jar) {
    group = 'lubricant'
    description = 'Build one jar that works on both fabric and neoforge'
    dependsOn ':fabric:remapJar', ':neoforge:jar'

    archiveBaseName = mod_id
    archiveVersion  = mod_version
    destinationDirectory = layout.buildDirectory.dir('libs')

    inputs.property 'version', mod_version

    from(file('bundle')) {
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json']) {
            expand(version: mod_version)
        }
    }
    from(tasks.getByPath(':fabric:remapJar').archiveFile) {
        into 'META-INF/jars'
        rename { "${mod_id}-fabric.jar" }
    }
    from(tasks.getByPath(':neoforge:jar').archiveFile) {
        into 'META-INF/jars'
        rename { "${mod_id}-neoforge.jar" }
    }
}

// Publish the bundle as a maven artifact so downstream mods can pull it
// from a static maven (GitHub Pages). Version is per-MC-branch SNAPSHOT
// so the same coordinates always resolve to the latest build for that MC version.
// Publications go to maven local (~/.m2/repository) only - the artifact is
// dev/internal, not for public distribution. -DEV suffix on the version keeps
// the filename literal (no SNAPSHOT timestamping) so updates overwrite in place.
publishing {
    publications {
        common(MavenPublication) {
            groupId    = 'wd40.lubricant'
            artifactId = 'common'
            version    = "${minecraft_version}-DEV"
            artifact tasks.named('jar')
        }
        bundle(MavenPublication) {
            groupId    = 'wd40.lubricant'
            artifactId = mod_id
            version    = "${minecraft_version}-DEV"
            artifact tasks.named('bundle')
        }
    }
}
