plugins {
    id 'java'
    id 'idea'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    group = mod_group
    version = mod_version

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.parchmentmc.org" }
    }
}

// Aggregate runner tasks. ./gradlew runAllClients launches both dev clients
// sequentially: close one to advance to the next.
tasks.register('runAllClients') {
    group = 'lubricant'
    description = 'Run fabric and neoforge dev clients sequentially'
    dependsOn ':fabric:runClient', ':neoforge:runClient'
}

tasks.register('runAllServers') {
    group = 'lubricant'
    description = 'Run fabric and neoforge dev servers sequentially'
    dependsOn ':fabric:runServer', ':neoforge:runServer'
}

// :common owns the bundle task. Use ./gradlew bundle (or :common:bundle).
tasks.register('bundle') {
    group = 'lubricant'
    description = 'Build one jar that works on both fabric and neoforge'
    dependsOn ':common:bundle'
}

// Publish all four artifacts (common, fabric, neoforge, bundle) to ~/.m2/repository
// for downstream mods to consume via mavenLocal(). Internal/dev only.
tasks.register('publish') {
    group = 'lubricant'
    description = 'Publish lubricant artifacts (common/fabric/neoforge/bundle) to maven local'
    dependsOn ':common:publishToMavenLocal',
              ':fabric:publishToMavenLocal',
              ':neoforge:publishToMavenLocal'
}
