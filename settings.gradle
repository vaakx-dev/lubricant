pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lubricant'

include 'common'
include 'fabric'
include 'neoforge'

// Example mod that consumes lubricant. Verifies the api end-to-end at build time.
include 'example:cog:common'
include 'example:cog:fabric'
include 'example:cog:neoforge'
project(':example:cog:common').projectDir   = file('example/cog/common')
project(':example:cog:fabric').projectDir   = file('example/cog/fabric')
project(':example:cog:neoforge').projectDir = file('example/cog/neoforge')
